<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS</title>
    <style>
        /* CSS Universal untuk perhitungan box model yang lebih baik */
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            
            /* BARU: Kunci scroll vertikal dan horizontal */
            overflow: hidden;
        }

        /* Container utama yang akan diposisikan di tengah */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Kotak konten QRIS */
        .qris-box {
            display: flex;
            flex-direction: column; /* Susun item ke bawah (judul, gambar, tombol) */
            align-items: center;
            justify-content: center;
            padding: 20px;
            
            /* BARU: Batasi tinggi maksimum agar tidak melebihi layar */
            max-height: 95vh; /* Maksimal 95% dari tinggi layar */
        }

        h1 {
            font-size: 1.5em; /* Ukuran font yang lebih fleksibel */
            margin-top: 0;
            margin-bottom: 15px;
            flex-shrink: 0; /* Mencegah judul mengecil */
        }

        img {
            /* BARU: Aturan ukuran yang lebih canggih */
            max-width: 90%;   /* Maksimal 90% dari lebar parent (.qris-box) */
            max-height: 60vh; /* Maksimal 60% dari tinggi layar */
            height: auto;
            width: auto;      /* Biarkan browser memilih antara tinggi atau lebar */
            
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            object-fit: contain; /* Pastikan gambar utuh dan tidak terpotong */
        }

        .download-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #28a745;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            flex-shrink: 0; /* Mencegah tombol mengecil */
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="qris-box">
            <h1>Pindai untuk Membayar</h1>
            <img src="qris-sp.jpeg" alt="Kode QRIS untuk Pembayaran">
            <a class="download-btn" href="qris-sp.jpeg" download="QRIS-Pembayaran.jpeg">
                Download QRIS
            </a>
        </div>
    </div>

</body>
</html>
