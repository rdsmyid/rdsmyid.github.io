<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS</title>

    <meta property="og:title" content="Pembayaran via QRIS" />
    <meta property="og:description" content="Pindai kode QRIS di halaman ini untuk melakukan pembayaran. Anda juga bisa mengunduh gambar QRIS untuk digunakan nanti." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rds.my.id/qris-sp/" />
    <meta property="og:image" content="https://www.rds.my.id/qris-sp/qsp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.rds.my.id/qris-sp/" />
    <meta name="twitter:title" content="Pembayaran via QRIS" />
    <meta name="twitter:description" content="Pindai kode QRIS di halaman ini untuk melakukan pembayaran. Anda juga bisa mengunduh gambar QRIS untuk digunakan nanti." />
    <meta name="twitter:image" content="https://www.rds.my.id/qris-sp/qsp.png" />
    
    <style>
        /* CSS Universal untuk perhitungan box model yang lebih baik */
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        /* Container utama yang akan diposisikan di tengah */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Kotak konten QRIS */
        .qris-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-height: 95vh;
        }

        h1 {
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        img {
            max-width: 90%;
            max-height: 60vh;
            height: auto;
            width: auto;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .download-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #28a745;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="qris-box">
            <h1>Pindai untuk Membayar</h1>
            <img src="qris-sp.jpeg" alt="Kode QRIS untuk Pembayaran">
            <a class="download-btn" href="qris-sp.jpeg" download="QRIS-Pembayaran.jpeg">
                Download QRIS
            </a>
        </div>
    </div>

</body>
</html>
